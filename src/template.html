<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Weather App</title>
</head>

<body>
	<main>
		<div id="upper-section">
			<h2 id="weather-condition">Sunny</h2>
			<h1 id="city">Dreams</h1>
		</div>
		<div id="bottom-section">
			<span id="temperature">100</span>
			<p>&degC</p>
			<div>
				<ul>
					<li id="feel">Feels like: 100°C</li>
					<li id="wind">Wind: 100 Km/h</li>
					<li id="humidity">Humidity: 100%</li>
				</ul>
			</div>
		</div>
	</main>
	<input type="text" placeholder="Search city">
</body>

</html>
