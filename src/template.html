<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Weather App</title>
</head>

<body>
	<main>
		<div id="upper-section">
			<h2 id="weather-condition">Sunny</h2>
			<h1 id="city">London</h1>
		</div>
		<div id="bottom-section">
			<span id="temperature">69
				<p>&degC</p>
			</span>
			<div>
				<ul>
					<li>Feels like</li>
					<li>Wind</li>
					<li>Humidity</li>
				</ul>
			</div>
		</div>
	</main>
	<input type="text" placeholder="Search city">
</body>

</html>
